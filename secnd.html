<title>Линейка 
  <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Умный Генератор Родословного Древа</title>
    <script type="text/javascript" src="https://unpkg.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .container {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .input-panel {
            width: 380px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 13px;
            resize: none;
            font-family: monospace;
            line-height: 1.4;
        }
        button {
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #219653;
        }
        .tree-panel {
            flex: 1;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        #network {
            width: 100%;
            height: 100%;
        }
        .hint {
            font-size: 12px;
            color: #7f8c8d;
            line-height: 1.4;
            background: #eef2f3;
            padding: 8px;
            border-radius: 4px;
        }
    </style>
</head>
<body>

    <h1>🌳 Интерактивное Генеалогическое Древа</h1>
    
    <div class="container">
        <div class="input-panel">
            <h3>Введите список родственников:</h3>
            <div class="hint">
                <strong>Варианты ввода:</strong><br>
                1. Как у вас: <code>Me: Имя</code>, <code>Father: Имя</code><br>
                2. Через стрелочку: <code>Отец -> Сын</code><br>
                3. Классический: <code>Имя (Родители: Мама, Папа)</code>
            </div>
            <textarea id="text-input" placeholder="Введите текст сюда..."></textarea>
            <button onclick="buildTree()">Построить древо</button>
        </div>
        
        <div class="tree-panel">
            <div id="network"></div>
        </div>
    </div>

    <script>
        // Вставляем ваш текст со скриншота в качестве примера по умолчанию
        document.getElementById('text-input').value = 
`Me: Murashkevich Anton Alyaksandravich
Father: Murashkevich Alyaksandr Branislavavich
Grandfather: Murashkevich Branislaus Uladzimiravich
Grandmother: Murashkevich Valyantsina Ilyinichna
Mother: Ihnatavich Viktoryya Antonauna`;

        let network = null;

        function buildTree() {
            const text = document.getElementById('text-input').value;
            const lines = text.split('\n');
            
            const nodesMap = new Map();
            const edges = [];
            
            // Временный объект для хранения ролей (Me, Father и т.д.)
            const roles = {};

            // ШАГ 1: Первый проход — ищем явные роли (как на скриншоте)
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                // Проверка на формат Роль: Имя (например, Father: Иван)
                const roleMatch = line.match(/^(me|я|father|отец|папа|mother|мать|мама|grandfather|дедушка|grandmother|бабушка)\s*:\s*(.+)\$/i);
                if (roleMatch) {
                    const roleKey = roleMatch[1].toLowerCase();
                    const name = roleMatch[2].trim();
                    roles[roleKey] = name;
                    
                    if (!nodesMap.has(name)) {
                        nodesMap.set(name, { id: name, label: name });
                    }
                }
            });

            // Связываем роли между собой, если они были найдены
            const me = roles['me'] || roles['я'];
            const father = roles['father'] || roles['отец'] || roles['папа'];
            const mother = roles['mother'] || roles['мать'] || roles['мама'];
            const grandfather = roles['grandfather'] || roles['дедушка'];
            const grandmother = roles['grandmother'] || roles['бабушка'];

            if (me) {
                if (father) edges.push({ from: father, to: me });
                if (mother) edges.push({ from: mother, to: me });
            }
            if (father) {
                // Если дедушка/бабушка имеют ту же фамилию, что и отец, привязываем их к отцу
                if (grandfather) edges.push({ from: grandfather, to: father });
                if (grandmother) edges.push({ from: grandmother, to: father });
            } else if (mother) {
                // Если отца нет, но есть мать — привязываем к ней
                if (grandfather) edges.push({ from: grandfather, to: mother });
                if (grandmother) edges.push({ from: grandmother, to: mother });
            }

            // ШАГ 2: Второй проход — обработка других форматов (стрелочки и скобки)
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                // Если строка уже обработана как роль, пропускаем её, чтобы не дублировать
                if (line.match(/^(me|я|father|отец|папа|mother|мать|мама|grandfather|дедушка|grandmother|бабушка)\s*:\s*/i)) {
                    return;
                }

                // Формат со стрелочкой: Родитель -> Ребенок
                if (line.includes('->')) {
                    const parts = line.split('->').map(p => p.trim());
                    if (parts.length === 2) {
                        const parent = parts[0];
                        const child = parts[1];
                        if (!nodesMap.has(parent)) nodesMap.set(parent, { id: parent, label: parent });
                        if (!nodesMap.has(child)) nodesMap.set(child, { id: child, label: child });
                        edges.push({ from: parent, to: child });
                    }
                    return;
                }

                // Стандартный формат со скобками: Имя (Родители: О, М)
                let name = line;
                const parentsRegex = /\((?:Родители\vert{}Родитель):\s*([^)]+)\)/i;
                const match = line.match(parentsRegex);
                
                if (match) {
                    name = line.replace(match, '').trim();
                    if (!nodesMap.has(name)) nodesMap.set(name, { id: name, label: name });
                    
                    const parents = match[1].split(',').map(p => p.trim());
                    parents.forEach(parentName => {
                        if (parentName) {
                            if (!nodesMap.has(parentName)) nodesMap.set(parentName, { id: parentName, label: parentName });
                            edges.push({ from: parentName, to: name });
                        }
                    });
                } else {
                    // Просто имя одиночного узла
                    if (!nodesMap.has(name)) nodesMap.set(name, { id: name, label: name });
                }
            });

            // Настройка внешнего вида карточек
            const nodes = Array.from(nodesMap.values()).map(node => {
                return {
                    ...node,
                    shape: 'box',
                    margin: 10,
                    color: {
                        background: '#ebf5fb',
                        border: '#2980b9',
                        highlight: { background: '#d4e6f1', border: '#2471a3' }
                    },
                    font: { face: 'Segoe UI', size: 14, color: '#2c3e50' },
                    borderWidth: 2
                };
            });

            // Добавляем стрелочки ко всем связям
            edges.forEach(edge => {
                edge.arrows = 'to';
                edge.color = { color: '#bdc3c7', inherit: false };
            });

            const data = {
                nodes: new vis.DataSet(nodes),
                edges: new vis.DataSet(edges)
            };

            const options = {
                layout: {
                    hierarchical: {
                        direction: 'UD', // Сверху вниз
                        sortMethod: 'directed',
                        nodeSpacing: 200,
                        levelSeparation: 120
                    }
                },
                physics: false,
                interaction: { dragNodes: true, zoomView: true, dragView: true }
            };

            const container = document.getElementById('network');
            if (network) network.destroy();
            network = new vis.Network(container, data, options);
        }

        window.onload = buildTree;
    </script>
</body>
</html>
