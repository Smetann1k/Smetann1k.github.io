      <!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Генератор Родословного Древа</title>
    <!-- Подключаем библиотеку Vis.js для работы с графами -->
    <script type="text/javascript" src="https://unpkg.com"></script>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            margin: 0;
            padding: 20px;
            background-color: #f4f7f6;
            display: flex;
            flex-direction: column;
            height: 100vh;
            box-sizing: border-box;
        }
        h1 {
            text-align: center;
            color: #2c3e50;
            margin-top: 0;
        }
        .container {
            display: flex;
            gap: 20px;
            flex: 1;
            min-height: 0;
        }
        .input-panel {
            width: 350px;
            display: flex;
            flex-direction: column;
            gap: 10px;
            background: white;
            padding: 15px;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
        }
        textarea {
            flex: 1;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 4px;
            font-size: 14px;
            resize: none;
            font-family: monospace;
        }
        button {
            padding: 12px;
            background-color: #27ae60;
            color: white;
            border: none;
            border-radius: 4px;
            font-size: 16px;
            cursor: pointer;
            font-weight: bold;
            transition: background 0.2s;
        }
        button:hover {
            background-color: #219653;
        }
        .tree-panel {
            flex: 1;
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            position: relative;
            overflow: hidden;
        }
        #network {
            width: 100%;
            height: 100%;
        }
        .hint {
            font-size: 12px;
            color: #7f8c8d;
            line-height: 1.4;
        }
    </style>
</head>
<body>

    <h1>🌳 Интерактивное Генеалогическое Древо</h1>
    
    <div class="container">
        <!-- Панель ввода данных -->
        <div class="input-panel">
            <h3>Введите список родственников:</h3>
            <p class="hint">Формат: <strong>Имя (Родители: Папа, Мама)</strong> или просто <strong>Имя</strong>. Каждая персона с новой строки.</p>
            <textarea id="text-input" placeholder="Пример:&#10;Иван Петров&#10;Анна Петрова&#10;Сергей Петров (Родители: Иван Петров, Анна Петрова)&#10;Ольга Петрова (Родитель: Сергей Петров)"></textarea>
            <button onclick="buildTree()">Построить древо</button>
        </div>
        
        <!-- Панель отображения древа -->
        <div class="tree-panel">
            <div id="network"></div>
        </div>
    </div>

    <script>
        // Демо-данные при первой загрузке
        document.getElementById('text-input').value = 
`Иван Иванов
Мария Иванова
Пётр Иванов (Родители: Иван Иванов, Мария Иванова)
Светлана Иванова (Родители: Иван Иванов, Мария Иванова)
Алексей Иванов (Родитель: Пётр Иванов)
Елена Иванова`;

        let network = null;

        function buildTree() {
            const text = document.getElementById('text-input').value;
            const lines = text.split('\n');
            
            const nodesMap = new Map();
            const edges = [];
            
            // Регулярные выражения для поиска родителей в скобках
            const parentsRegex = /\((?:Родители\vert{}Родитель):\s*([^)]+)\)/i;

            // Шаг 1: Парсим строки и собираем людей
            lines.forEach(line => {
                line = line.trim();
                if (!line) return;

                let name = line;
                let parentsStr = "";

                const match = line.match(parentsRegex);
                if (match) {
                    parentsStr = match[1];
                    // Очищаем имя человека от скобок с родителями
                    name = line.replace(match[0], '').trim();
                }

                // Добавляем человека в базу, если его там еще нет
                if (!nodesMap.has(name)) {
                    nodesMap.set(name, { id: name, label: name });
                }

                // Если указаны родители, обрабатываем их
                if (parentsStr) {
                    // Разделяем родителей по запятой
                    const parents = parentsStr.split(',').map(p => p.trim());
                    parents.forEach(parentName => {
                        if (parentName) {
                            // Гарантируем, что родитель тоже есть в списке узлов
                            if (!nodesMap.has(parentName)) {
                                nodesMap.set(parentName, { id: parentName, label: parentName });
                            }
                            // Создаем связь от Родителя к Ребенку
                            edges.push({
                                from: parentName,
                                to: name,
                                arrows: 'to',
                                color: { color: '#7f8c8d', inherit: false }
                            });
                        }
                    });
                }
            });

            // Преобразуем Map в массив для Vis.js
            const nodes = Array.from(nodesMap.values()).map(node => {
                // Стилизуем узлы
                return {
                    ...node,
                    shape: 'box',
                    margin: 10,
                    color: {
                        background: '#ebf5fb',
                        border: '#2980b9',
                        highlight: { background: '#d4e6f1', border: '#2471a3' }
                    },
                    font: { face: 'Segoe UI', size: 14, color: '#2c3e50' },
                    borderWidth: 2
                };
            });

            // Данные для Vis.js Network
            const data = {
                nodes: new vis.DataSet(nodes),
                edges: new vis.DataSet(edges)
            };

            // Настройки отображения (иерархическая структура сверху вниз)
            const options = {
                layout: {
                    hierarchical: {
                        direction: 'UD', // Up-Down (Сверху вниз)
                        sortMethod: 'directed',
                        nodeSpacing: 150,
                        levelSeparation: 100
                    }
                },
                physics: false, // Отключаем хаотичное движение узлов
                interaction: {
                    dragNodes: true,
                    zoomView: true,
                    dragView: true
                }
            };

            // Инициализация или обновление графа
            const container = document.getElementById('network');
            if (network) {
                network.destroy();
            }
            network = new vis.Network(container, data, options);
        }

        // Строим древо автоматически при загрузке страницы
        window.onload = buildTree;
    </script>
</body>
</html>

</title>
